<ui-form-field labelKey="userForm.name">
  <ui-input [formControl]="form().controls.fullName" />
</ui-form-field>
<ui-form-field labelKey="userForm.email">
  <ui-input type="email" autocomplete="off" [formControl]="form().controls.email" />
</ui-form-field>
<ui-form-field labelKey="userForm.role">
  <ui-select [formControl]="form().controls.role" [options]="roles" />
</ui-form-field>
