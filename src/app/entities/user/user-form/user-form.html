<form class="user-form" [formGroup]="form" (ngSubmit)="submit()">
  <ui-form-field label="userForm.name">
    <ui-input formControlName="fullName" />
  </ui-form-field>
  <ui-form-field label="userForm.email">
    <ui-input type="email" autocomplete="off" formControlName="email" />
  </ui-form-field>
  <ui-form-field label="userForm.role">
    <ui-select formControlName="role" [options]="roles" />
  </ui-form-field>
  @if (serverError()) {
    <ui-alert>{{ serverError() }}</ui-alert>
  }
  <div class="user-form__actions">
    <button uiButton type="button" variant="secondary" (click)="cancelled.emit()">
      {{ 'common.cancel' | translate }}
    </button>
    <button uiButton type="submit" [disabled]="saving()">
      {{ (saving() ? 'userForm.saving' : 'userForm.save') | translate }}
    </button>
  </div>
</form>
