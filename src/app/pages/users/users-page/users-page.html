<app-page-container>
  <app-page-header [title]="'users.title' | translate">
    <button uiButton type="button" (click)="openCreate()">{{ 'users.add' | translate }}</button>
  </app-page-header>

  <div class="users-page__filters" [formGroup]="filterForm">
    <ui-input
      class="users-page__filter"
      [label]="'users.search' | translate"
      autocomplete="off"
      formControlName="search"
    />
    <ui-select
      class="users-page__filter"
      [label]="'users.columnRole' | translate"
      formControlName="role"
      [options]="roleFilterOptions"
    />
  </div>

  @if (page.state.error()) {
    <ui-alert>{{ page.state.error() }}</ui-alert>
  }

  @if (state.removeError()) {
    <ui-alert>{{ state.removeError() }}</ui-alert>
  }

  @if (page.state.initialLoading()) {
    <ui-card [flush]="true">
      <ui-table-skeleton [columns]="columns">
        <ng-template uiTableSkeletonRow>
          <tr app-user-list-row-skeleton></tr>
        </ng-template>
      </ui-table-skeleton>
    </ui-card>
  } @else if (page.state.loaded()) {
    <ui-card [flush]="true">
      <ui-table
        [rows]="state.users()"
        [columns]="columns"
        [rowKey]="rowKey"
        emptyLabel="users.empty"
      >
        <ng-template uiTableRow let-user>
          <tr
            app-user-list-row
            [user]="user"
            (edit)="openEdit(user)"
            (remove)="requestDelete(user)"
          ></tr>
        </ng-template>
      </ui-table>
    </ui-card>
  }

  @if (page.state.refreshing()) {
    <ui-spinner [hasOverlay]="true" />
  }

  @if (state.pageCount() > 1) {
    <ui-pagination
      [page]="state.page()"
      [pageCount]="state.pageCount()"
      (pageChange)="state.setPage($event)"
    />
  }
</app-page-container>
