<app-page-container>
  <app-page-header [title]="'users.title' | translate">
    <button uiButton type="button" data-testid="users-add" (click)="openCreate()">
      {{ 'users.add' | translate }}
    </button>
  </app-page-header>

  <ui-filters [formGroup]="state.filterForm">
    <ui-form-field labelKey="users.search" data-testid="users-search-field">
      <ui-input autocomplete="off" [formControl]="state.filterForm.controls.search" />
    </ui-form-field>
    <ui-form-field labelKey="users.columnRole" data-testid="users-role-field">
      <ui-select [formControl]="state.filterForm.controls.role" [options]="roleFilterOptions" />
    </ui-form-field>
  </ui-filters>

  @if (state.loader.error()) {
    <ui-alert data-testid="users-error">{{ state.loader.error() }}</ui-alert>
  }

  @if (state.loader.refreshing()) {
    <ui-spinner [hasOverlay]="true" />
  }

  @if (state.loader.initialLoading()) {
    <ui-card [flush]="true">
      <ui-table-skeleton [columns]="columns">
        <ng-template uiTableSkeletonRow>
          <tr app-user-list-row-skeleton></tr>
        </ng-template>
      </ui-table-skeleton>
    </ui-card>
  } @else if (state.loader.loaded()) {
    <ui-card [flush]="true">
      <ui-table
        [rows]="state.list.items()"
        [columns]="columns"
        [rowKey]="rowKey"
        emptyLabelKey="users.empty"
      >
        <ng-template uiTableRow let-user>
          <tr
            app-user-list-row
            data-testid="user-row"
            [attr.data-user-email]="user.email"
            [user]="user"
            (edit)="openEdit(user)"
            (remove)="requestDelete(user)"
          ></tr>
        </ng-template>
      </ui-table>
    </ui-card>
  }

  @if (state.list.pageCount() > 1) {
    <ui-pagination
      [page]="state.list.page()"
      [pageCount]="state.list.pageCount()"
      (pageChange)="state.setPage($event)"
    />
  }
</app-page-container>
