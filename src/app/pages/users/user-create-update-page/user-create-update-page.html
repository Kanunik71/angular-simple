<app-page-container width="narrow">
  <app-page-header [title]="titleKey() | translate">
    <button uiButton type="button" variant="ghost" (click)="back()">
      {{ 'common.backToList' | translate }}
    </button>
  </app-page-header>

  <ui-card>
    @if (state.loader.initialLoading()) {
      <div class="user-create-update-page__skeleton">
        <ui-skeleton width="100%" height="40px" />
        <ui-skeleton width="100%" height="40px" />
        <ui-skeleton width="60%" height="40px" />
        <ui-form-actions>
          <ui-skeleton width="96px" height="36px" />
          <ui-skeleton width="120px" height="36px" />
        </ui-form-actions>
      </div>
    } @else if (!state.loader.loaded()) {
      <div class="user-create-update-page__missing">
        <ui-alert>{{ state.loader.error() }}</ui-alert>
        <button uiButton type="button" (click)="back()">
          {{ 'common.backToList' | translate }}
        </button>
      </div>
    } @else {
      <ui-form [formGroup]="state.form" (submitted)="state.save()">
        <app-user-create-update-form [form]="state.form" />

        @if (state.loader.error()) {
          <ui-alert>{{ state.loader.error() }}</ui-alert>
        }

        <ui-form-actions>
          <button uiButton type="button" variant="secondary" (click)="back()">
            {{ 'common.cancel' | translate }}
          </button>
          <button uiButton type="submit" [disabled]="state.loader.loading()">
            {{ (state.loader.loading() ? 'userForm.saving' : 'userForm.save') | translate }}
          </button>
        </ui-form-actions>
      </ui-form>
    }
  </ui-card>
</app-page-container>
