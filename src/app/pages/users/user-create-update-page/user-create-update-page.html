<app-page-container width="narrow">
  <app-page-header [title]="titleKey() | translate">
    <button uiButton type="button" variant="ghost" (click)="back()">
      {{ 'common.backToList' | translate }}
    </button>
  </app-page-header>

  <ui-card>
    @if (loading()) {
      <div class="user-create-update-page__skeleton">
        <ui-skeleton width="100%" height="40px" />
        <ui-skeleton width="100%" height="40px" />
        <ui-skeleton width="60%" height="40px" />
        <ui-form-actions>
          <ui-skeleton width="96px" height="36px" />
          <ui-skeleton width="120px" height="36px" />
        </ui-form-actions>
      </div>
    } @else if (pageError()) {
      <div class="user-create-update-page__missing">
        <ui-alert>{{ pageError() }}</ui-alert>
        <button uiButton type="button" (click)="back()">
          {{ 'common.backToList' | translate }}
        </button>
      </div>
    } @else {
      <app-user-create-update-form
        [user]="user()"
        [saving]="state.saving()"
        [serverError]="state.formError()"
        (submitted)="save($event)"
        (cancelled)="back()"
      />
    }
  </ui-card>
</app-page-container>
