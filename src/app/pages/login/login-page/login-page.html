<section class="login-page">
  <ui-card class="login-page__card">
    <form class="login-page__form" [formGroup]="form" (ngSubmit)="submit()">
      <header class="login-page__header">
        <h1 class="login-page__title">{{ 'login.title' | translate }}</h1>
        <p class="login-page__hint">{{ 'login.hint' | translate }}</p>
      </header>

      <ui-form-field label="login.username">
        <ui-input autocomplete="username" formControlName="username" />
      </ui-form-field>
      <ui-form-field label="login.password">
        <ui-input type="password" autocomplete="current-password" formControlName="password" />
      </ui-form-field>

      @if (error()) {
        <ui-alert>{{ error() }}</ui-alert>
      }

      <button uiButton class="login-page__submit" type="submit" [disabled]="loading()">
        {{ (loading() ? 'login.submitting' : 'login.submit') | translate }}
      </button>
    </form>
  </ui-card>
</section>
