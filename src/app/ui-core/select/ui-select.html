<select
  class="ui-field__control"
  [id]="fieldId"
  [disabled]="disabled()"
  (change)="onSelect($event)"
  (blur)="onBlur()"
>
  @for (option of options(); track option.value) {
    <option [value]="option.value" [selected]="option.value === value()">
      {{ option.label | translate }}
    </option>
  }
</select>
