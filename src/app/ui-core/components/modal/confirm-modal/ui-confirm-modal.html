<ui-modal [title]="titleKey() | translate" (closed)="close(false)">
  <p class="ui-confirm-modal__message">{{ messageKey() | translate: messageParams() }}</p>
  <div class="ui-confirm-modal__actions">
    <button uiButton type="button" variant="secondary" (click)="close(false)">
      {{ cancelLabelKey() | translate }}
    </button>
    <button uiButton type="button" [variant]="variant()" (click)="close(true)">
      {{ confirmLabelKey() | translate }}
    </button>
  </div>
</ui-modal>
