<nav class="ui-pagination">
  <button
    uiButton
    type="button"
    variant="secondary"
    data-testid="pagination-prev"
    [disabled]="page() <= 1"
    (click)="previous()"
  >
    {{ 'pagination.previous' | translate }}
  </button>

  <span class="ui-pagination__status" data-testid="pagination-status">
    {{ 'pagination.page' | translate: { page: page(), total: pageCount() } }}
  </span>

  <button
    uiButton
    type="button"
    variant="secondary"
    data-testid="pagination-next"
    [disabled]="page() >= pageCount()"
    (click)="next()"
  >
    {{ 'pagination.next' | translate }}
  </button>
</nav>
