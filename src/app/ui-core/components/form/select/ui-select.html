<button
  #trigger="cdkOverlayOrigin"
  cdkOverlayOrigin
  type="button"
  class="ui-field__control ui-select__trigger"
  [id]="fieldId"
  [disabled]="disabled()"
  (click)="toggle()"
  (keydown)="onTriggerKeydown($event)"
  (blur)="onTriggerBlur()"
>
  <span class="ui-select__label">
    @if (selectedOption(); as option) {
      {{ option.labelKey | translate }}
    }
  </span>
  <ui-icon
    class="ui-select__chevron"
    [class.ui-select__chevron--open]="open()"
    name="chevron-down"
    size="sm"
  />
</button>

<ng-template
  cdkConnectedOverlay
  [cdkConnectedOverlayOrigin]="trigger"
  [cdkConnectedOverlayOpen]="open()"
  [cdkConnectedOverlayPositions]="positions"
  [cdkConnectedOverlayMatchWidth]="true"
  [cdkConnectedOverlayOffsetY]="4"
  [cdkConnectedOverlayViewportMargin]="8"
  [cdkConnectedOverlayDisableClose]="true"
  (attach)="onAttach()"
  (detach)="onDetach()"
  (overlayOutsideClick)="close(false)"
  (overlayKeydown)="onOverlayKeydown($event)"
>
  <div
    class="ui-select__panel"
    cdkListbox
    [cdkListboxValue]="listboxValue()"
    [cdkListboxDisabled]="disabled()"
    [cdkListboxUseActiveDescendant]="false"
    (cdkListboxValueChange)="onListboxValueChange($event)"
  >
    @for (option of options(); track option.value) {
      <div
        class="ui-select__option"
        data-testid="select-option"
        [attr.data-value]="option.value"
        [class.ui-select__option--selected]="option.value === value()"
        cdkOption
        [cdkOption]="option.value"
        (click)="onOptionClick(option.value)"
      >
        {{ option.labelKey | translate }}
      </div>
    }
  </div>
</ng-template>
